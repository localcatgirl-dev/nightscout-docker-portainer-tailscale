version: "3"

x-logging: &default-logging
   options:
      max-size: "10m"
      max-file: "5"
   driver: json-file

services:
   mongo:
      image: mongo:latest
      restart: always
      volumes:
         - ${NS_MONGO_DATA_DIR:-./mongo-data}:/data/db:cached
      logging: *default-logging

   nightscout:
      image: nightscout/cgm-remote-monitor:latest
      container_name: nightscout
      restart: always
      ports:
      - "1337:1337"
      depends_on:
         - mongo
      # labels:
      #    - "traefik.enable=disabled"
      #    # Change the below Host from `localhost` to be the web address where Nightscout is running.
      #    # Also change the email address in the `traefik` service below.
      #    - "traefik.http.routers.nightscout.rule=Host(`localhost`)"
      #    - "traefik.http.routers.nightscout.entrypoints=websecure"
      #    - "traefik.http.routers.nightscout.tls.certresolver=le"
      logging: *default-logging
      environment:
         ### Variables for the container
         NODE_ENV: production
         TZ: ${MY_TZ}

         ### Overridden variables for Docker Compose setup
         # The `nightscout` service can use HTTP, because we use `traefik` to serve the HTTPS
         # and manage TLS certificates
         INSECURE_USE_HTTP: "true"
         # Listen on all container interfaces so reverse proxies and other containers can reach Nightscout
         NIGHTSCOUT_HOSTNAME: "0.0.0.0"

         # For all other settings, please refer to the Environment section of the README
         ### Required variables
         # MONGO_CONNECTION - The connection string for your Mongo database.
         # Something like mongodb://sally:sallypass@ds099999.mongolab.com:99999/nightscout
         # The default connects to the `mongo` included in this docker-compose file.
         # If you change it, you probably also want to comment out the entire `mongo` service block
         # and `depends_on` block above.
         MONGO_CONNECTION: mongodb://mongo:27017/nightscout

         # API_SECRET - A secret passphrase that must be at least 12 characters long.
         API_SECRET: ${MY_API_SECRET}

         ### Features
         # ENABLE - Used to enable optional features, expects a space delimited list, such as: careportal rawbg iob
         # See https://github.com/nightscout/cgm-remote-monitor#plugins for details
         ENABLE: careportal rawbg iob cob delta direction upbat timeago devicestatus errorcodes ar2 profile cage sage basal bolus pump openaps dbsize
         SHOW_FORECAST: openaps
 
         # AUTH_DEFAULT_ROLES (readable) - possible values readable, denied, or any valid role name.
         # When readable, anyone can view Nightscout without a token. Setting it to denied will require
         # a token from every visit, using status-only will enable api-secret based login.
         AUTH_DEFAULT_ROLES: readable
         # For all other settings, please refer to the Environment section of the README
         # https://github.com/nightscout/cgm-remote-monitor#environment

         DISPLAY_UNITS: mmol/L

   # traefik:
   #    image: traefik:latest
   #    restart: always
   #    container_name: "traefik"
   #    command:
   #       - "--providers.docker=true"
   #       - "--providers.docker.exposedbydefault=false"
   #       - "--entrypoints.web.address=:80"
   #       - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
   #       - "--entrypoints.websecure.address=:443"
   #       - "--certificatesresolvers.le.acme.httpchallenge=true"
   #       - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
   #       - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
   #       # Change the below to match your email address
   #       - "--certificatesresolvers.le.acme.email=example@example.com"
   #    ports:
   #       - "443:443"
   #       - "80:80"
   #    volumes:
   #       - "./letsencrypt:/letsencrypt"
   #       - "/var/run/docker.sock:/var/run/docker.sock:ro"
   #    logging: *default-logging

   # https://tailscale.com/docs/features/containers/docker/how-to/connect-docker-container
   tailscale:
      image: tailscale/tailscale:latest
      container_name: tailscale
      hostname: tailscale-nginx
      environment:
      - TS_AUTHKEY=${MY_TS_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      volumes:
      - ./tailscale-state:/var/lib/tailscale
      cap_add:
      - net_admin
      - net_raw
      restart: unless-stopped

   nginx:
      image: nginx:latest
      container_name: nginx_server
      ports:
      - "8080:80"
      depends_on:
      - tailscale
      restart: unless-stopped